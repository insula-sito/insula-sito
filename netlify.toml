# Configurazione del deploy su Netlify.
# Netlify legge questo file a ogni build: le impostazioni qui prevalgono
# su quelle inserite nell'interfaccia web.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Astro 7 richiede Node 22.23.4 o successivo; 24 è la versione LTS.
  NODE_VERSION = "24"

# Intestazioni di sicurezza per tutte le pagine.
# Il sito non usa script, font o embed di terze parti: tutto viene dallo stesso dominio.
# 'unsafe-inline' sugli stili serve per i fogli che Astro inserisce nella pagina
# e per gli attributi style della pianta.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    # Finché nome, dati legali e informativa privacy non sono definitivi,
    # il sito non va indicizzato dai motori di ricerca.
    # Da togliere al lancio (vedi docs/stato.md, «Bloccanti per la pubblicazione»).
    X-Robots-Tag = "noindex, nofollow"

# File con l'impronta nel nome (CSS, JS, font): possono restare in cache a lungo.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
